[project]
name = "campuspath-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.1",
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.0",
    "langchain-tavily>=0.2.18",
]

[dependency-groups]
dev = ["pytest>=8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
