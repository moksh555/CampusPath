[project]
name = "campuspath-backend"
version = "0.1.0"
description = "CampusPath API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.43",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.10.1",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.1.1",
    "pytest>=8.4.1",
    "alembic>=1.16",
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.0",
    "langchain-tavily>=0.2.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
